name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q "$(ls *.zip | head -n1)"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: FlagGates_Android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FlagGates-debug-apk
          path: FlagGates_Android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK as a Release (direct download)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp FlagGates_Android/app/build/outputs/apk/debug/app-debug.apk FlagGates.apk
          gh release create "v${{ github.run_number }}" FlagGates.apk --title "Flag Gates build ${{ github.run_number }}" --notes "Debug APK"
